<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
<title>Impulso+ Ideias de Anúncios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: cabeçalho fixo com 4 abas; anúncios em cartões de duas colunas (texto Impulso+ à esquerda, referência à direita) */
:root{
  --bg:#F3F6FC; --surface:#FFFFFF; --fg:#0E1A33; --muted:#56637F; --line:#DAE2F1;
  --accent:#2F6FED; --accent-fg:#FFFFFF; --accent-soft:#E6EEFD; --warn-bg:#FFF4DB; --warn-fg:#6B4A00;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111F; --surface:#111A2D; --fg:#E7EDFA; --muted:#93A1BE; --line:#223050;
  --accent:#6C9BFF; --accent-fg:#0A111F; --accent-soft:#16264A; --warn-bg:#3A2E10; --warn-fg:#F2D48A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111F; --surface:#111A2D; --fg:#E7EDFA; --muted:#93A1BE; --line:#223050;
  --accent:#6C9BFF; --accent-fg:#0A111F; --accent-soft:#16264A; --warn-bg:#3A2E10; --warn-fg:#F2D48A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font:700 18px var(--font-display);letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:500 14px var(--font-body);color:var(--muted);background:none;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
nav button:hover{color:var(--fg);background:var(--accent-soft)}
nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
button:focus-visible,a:focus-visible,video:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:32px 72px}
h1{font:700 clamp(28px,4.4vw,44px)/1.08 var(--font-display);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance;max-width:20ch}
h2{font:700 clamp(22px,3vw,28px)/1.15 var(--font-display);letter-spacing:-.015em;margin:0 0 8px;text-wrap:balance}
h3{font:700 18px/1.25 var(--font-display);margin:0 0 6px}
.lead{color:var(--muted);max-width:62ch;margin:0 0 28px}
.eyebrow{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.view[hidden]{display:none}
/* mapa */
.map{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:36px}
.groups{display:grid;gap:12px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.group h4{margin:0 0 8px;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 14px var(--font-body);background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.chip:hover{filter:brightness(.96)}
.arrow{font:700 28px var(--font-display);color:var(--accent)}
.goal{background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:22px}
.goal b{font:700 22px/1.15 var(--font-display);display:block;margin-bottom:6px}
.goal span{font-size:15px;opacity:.92}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:10px}
/* anuncios */
.list{display:grid;gap:24px}
.ad{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ad-main{padding:26px 28px;display:grid;gap:14px;align-content:start;min-width:0}
.ad-ref{background:var(--accent-soft);padding:20px;border-left:1px solid var(--line);display:grid;gap:10px;align-content:start;min-width:0}
.ad-ref figure{margin:0;display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.ad-ref img,.ad-ref video{width:100%;height:auto;border-radius:10px;display:block;background:#000;max-height:560px;object-fit:contain}
.tag{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ad-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{font:700 14px var(--font-display);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:3px 10px}
.mec{font-size:14px;color:var(--muted)}
.headline{font:700 clamp(22px,2.6vw,28px)/1.15 var(--font-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
mark{background:none;color:var(--accent)}
.sub{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.body{margin:0}
ul.bul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.bul li{padding-left:22px;position:relative}
ul.bul li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:2px;background:var(--accent)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);font:600 15px var(--font-body);border-radius:999px;padding:9px 18px}
.meta{display:grid;gap:10px;font-size:14px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.copybox{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;background:var(--bg)}
.copybox .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.copybox pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word}
.copy{font:600 13px var(--font-body);color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 14px;font-size:14px}
.refcap{font-size:14px}
.refcap b{display:block;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.switch{display:flex;gap:6px}
.switch button{font:600 13px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
/* canais */
.canal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 28px;display:grid;gap:18px}
.canal-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.pill{font:600 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol.steps li{counter-increment:s;padding-left:34px;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--font-display);text-align:center}
.first{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.first b{color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:500;font-size:14px}
.flow i{font-style:normal;color:var(--accent);font-weight:700}
.msg{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:0;color:var(--fg)}
.cta-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:28px}
@media (max-width:860px){
  .ad{grid-template-columns:1fr}
  .ad-ref{order:-1;border-left:0;border-bottom:1px solid var(--line)}
  .ad-ref figure{position:static}
  .ad-ref img,.ad-ref video{max-height:380px}
  .ad-main,.canal{padding:20px 18px}
  .map{grid-template-columns:1fr}
  .arrow{transform:rotate(90deg);justify-self:center}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>

const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k==='class') e.className=v; else if (k==='text') e.textContent=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k,v);
  }
  for (const c of kids.flat()) if (c!=null) e.append(c.nodeType? c : document.createTextNode(c));
  return e;
};
const copy = async (text, btn) => {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent='Copiado'; }
  catch(e) { const r=document.createRange(); r.selectNodeContents(btn.closest('.copybox').querySelector('pre')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent='Texto selecionado'; }
  setTimeout(()=>btn.textContent=old,1600);
};
const copybox = (label, text) => h('div',{class:'copybox'},
  h('div',{class:'head'}, h('span',{class:'sub',style:'margin:0',text:label}), h('button',{class:'copy',type:'button',text:'Copiar',onclick:e=>copy(text,e.currentTarget)})),
  h('pre',{text}));
const hl = (text, part) => { const i = part ? text.indexOf(part) : -1; return i<0 ? [text] : [text.slice(0,i), h('mark',{text:part}), text.slice(i+part.length)]; };

      if (warn) return h('div',{class:'warn',text:s.text});
      if (s.label==='Fala') return copybox('Fala', s.text);
      return h('div',{}, h('p',{class:'sub',text:s.label.replace(/\s*\(.*\)/,'')}), h('p',{class:'body',style:'white-space:pre-wrap',text:s.text}));
    }));
  return h('article',{class:'ad',id:`v${d.n}`}, main, h('div',{class:'ad-ref'}, figure));
}
function canalCard(c){
  return h('article',{class:'canal',id:c.id},
    h('div',{class:'canal-head'}, h('h2',{text:c.nome}), h('span',{class:'pill',text:c.tipo})),
    h('p',{class:'body',style:'margin:0;max-width:70ch',text:c.ideia}),
    c.fluxo? h('div',{class:'flow'}, c.fluxo.flatMap((f,i)=> i? [h('i',{text:'›'}), h('span',{text:f})] : [h('span',{text:f})])):null,
    h('div',{class:'cols'},
      h('div',{}, h('p',{class:'sub',text:'Como funciona'}), h('ol',{class:'steps'}, c.passos.map(p=>h('li',{text:p})))),
      h('div',{}, h('p',{class:'sub',text:'O que precisa'}), h('ul',{class:'bul'}, c.precisa.map(p=>h('li',{text:p}))),
        h('p',{class:'sub',style:'margin-top:16px',text:'O que medir'}), h('ul',{class:'bul'}, c.medir.map(p=>h('li',{text:p}))))),
    c.mensagens? h('div',{}, h('p',{class:'sub',text:'Exemplos de primeira mensagem'}), h('div',{style:'display:grid;gap:10px'}, c.mensagens.map(m=>h('p',{class:'msg',text:m})))):null,
    c.cuidado? h('div',{class:'warn',text:c.cuidado}):null,
    h('div',{class:'first'}, h('b',{text:'Primeiro passo: '}), c.primeiro));
}
const go = id => { if (location.hash !== '#'+id) location.hash = id; else render(); };
function visao(){
  const sec = h('section',{class:'view'},
    h('p',{class:'eyebrow',text:'Plano de aquisição'}),
    h('h1',{text:'Todos os caminhos levam à demonstração de 30 minutos'}),
    h('p',{class:'lead',text:'O tráfego pago é um canal. Esta página reúne as ideias de anúncio, com a referência ao lado de cada uma, e os outros canais para trazer médicos até a demonstração do Painel Clínico e vender a Band.'}),
    h('div',{class:'map'},
      h('div',{class:'groups'},
        [['Pago',[['Tráfego pago','estaticos'],['Conteúdo para médicos','canais#conteudo']]],
         ['Presencial',[['Mini-eventos','canais#eventos'],['Patrocínio de eventos','canais#patrocinio']]],
         ['Parcerias',[['Embaixadores','canais#embaixadores'],['Infoprodutores','canais#infoprodutores']]],
         ['Ativo',[['Prospecção ativa','canais#prospeccao']]]].map(([g,items])=>h('div',{class:'group'}, h('h4',{text:g}), h('div',{class:'chips'}, items.map(([l,t])=>h('button',{class:'chip',type:'button',text:l,onclick:()=>{ const [v,a]=t.split('#'); go(a||v); if(a) setTimeout(()=>document.getElementById(a)?.scrollIntoView({behavior:'smooth'}),30); }})))))),
      h('div',{class:'arrow',text:'›'}),
      h('div',{class:'goal'}, h('b',{text:'Demonstração de 30 minutos'}), h('span',{text:'Agendada pelo Calendly. Quem não agenda recebe contato manual da equipe. Depois da demo: Band no pulso do paciente e Painel Médico no consultório.'}))),
    h('h2',{text:'Comparativo rápido dos canais'}),
    h('div',{class:'tbl'}, h('table',{}, h('thead',{}, h('tr',{}, ['Canal','Tipo','Velocidade dos primeiros leads','Esforço da equipe','Investimento'].map(x=>h('th',{text:x})))),
      h('tbody',{}, COMPARA.map(r=>h('tr',{}, r.map(c=>h('td',{text:c}))))))),
    h('p',{class:'note',text:'Estimativa qualitativa para orientar a ordem de teste. Os números reais saem do primeiro mês de cada canal.'}));
  return sec;
}
function estaticos(){
  return h('section',{class:'view'}, h('p',{class:'eyebrow',text:'Tráfego pago'}), h('h2',{text:'Anúncios estáticos'}),
    h('p',{class:'lead',text:'Cada anúncio mantém o mecanismo de uma referência que já funciona e reescreve a mensagem para o acompanhamento entre consultas, com a Band e o Painel Médico.'}),
    h('div',{class:'list'}, DATA.statics.map(staticCard)));
}
function videos(){
  return h('section',{class:'view'}, h('p',{class:'eyebrow',text:'Tráfego pago'}), h('h2',{text:'Anúncios em vídeo'}),
    h('p',{class:'lead',text:'Roteiros adaptados das falas dos vídeos de referência. Toque no vídeo ao lado para ver como o original funciona.'}),
    h('div',{class:'list'}, DATA.videos.map(videoCard)));
}
function canais(){
  return h('section',{class:'view'}, h('p',{class:'eyebrow',text:'Além do tráfego pago'}), h('h2',{text:'Outros canais de aquisição'}),
    h('p',{class:'lead',text:'Seis canais para testar em paralelo ao tráfego pago. Cada um tem o passo a passo, o que precisa, o que medir e o primeiro passo.'}),
    h('div',{class:'list'}, CANAIS.map(canalCard)));
}
const RENDER = {estaticos, videos};
function render(){
  const id = (location.hash||'').slice(1);
  const view = RENDER[id] ? id : 'estaticos';
  document.getElementById('nav').replaceChildren(...VIEWS.map(v=>h('button',{type:'button','aria-current':String(v.id===view),text:v.label,onclick:()=>{location.hash=v.id; scrollTo(0,0)}})));
  document.getElementById('app').replaceChildren(RENDER[view]());
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
